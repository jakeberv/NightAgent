schema_version: 1
id: fashion-mnist-pilot
task: tabular_classification
brief: Classify ten clothing categories from 28 by 28 grayscale Fashion-MNIST images. Optimize validation accuracy, with macro-F1 and macro one-vs-rest ROC-AUC as secondary metrics. Training and validation use a fixed stratified subset of the official training set. The 0.80 and 0.85 accuracy targets are provisional calibration thresholds, not established benchmark guarantees. Neural models use preprocessing none and fixed pixel scaling internally.
dataset:
  format: npz
  path: ../../study-data/fashion-source/fashion-pilot.npz
  feature_array: x_train
  target_array: y_train
  test_feature_array: x_test
  test_target_array: y_test
  flatten: true
evaluation:
  split: {method: predefined_test, train: 0.8, validation: 0.2, test: official, seed: 42}
  objective: {metric: accuracy, direction: maximize}
  additional_metrics: [macro_f1, roc_auc_ovr_macro]
targets:
  - {name: calibration_milestone, value: 0.80}
  - {name: calibration_stretch, value: 0.85}
search_space:
  preset: tabular_classification_small
  models: [logistic, random_forest, torch_mlp, torch_cnn]
  preprocessing: [standard, none]
  parameters:
    logistic:
      max_iter: {minimum: 100, maximum: 300}
    random_forest:
      n_estimators: {minimum: 30, maximum: 100}
      max_depth: {minimum: 8, maximum: 20}
      max_features: {enum: [sqrt, log2]}
    torch_mlp:
      epochs: {minimum: 1, maximum: 5}
      batch_size: {minimum: 128, maximum: 512}
      hidden_width: {minimum: 64, maximum: 128}
    torch_cnn:
      epochs: {minimum: 1, maximum: 5}
      batch_size: {minimum: 128, maximum: 512}
      channels: {minimum: 8, maximum: 16}

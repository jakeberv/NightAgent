name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  study-tests:
    name: Study tests (CPU, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-study.txt
      - name: Install study dependencies and CPU-only PyTorch
        run: |
          python -m pip install -r requirements-study.txt
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip check
      - name: Record environment and verify CPU runtime
        run: |
          mkdir -p ci-results
          python -m pip freeze > ci-results/dependencies.txt
          python - <<'PY'
          import torch
          print(f'PyTorch {torch.__version__}; CPU-only validation')
          assert torch.version.cuda is None
          assert not torch.cuda.is_available()
          assert not torch.backends.mps.is_available()
          PY
      - name: Run full offline test suite
        run: python -m pytest -q --junitxml=ci-results/pytest.xml
      - name: Upload test results and dependency versions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-test-results
          path: ci-results/
          if-no-files-found: ignore
          retention-days: 7

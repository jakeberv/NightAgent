name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  study-tests:
    name: Study tests (CPU, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-study.txt
      - name: Install study dependencies and CPU-only PyTorch
        run: |
          python -m pip install -r requirements-study.txt
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip check
      - name: Record environment and verify CPU runtime
        run: |
          mkdir -p ci-results
          python -m pip freeze > ci-results/dependencies.txt
          python - <<'PY'
          import torch
          print(f'PyTorch {torch.__version__}; CPU-only validation')
          assert torch.version.cuda is None
          assert not torch.cuda.is_available()
          assert not torch.backends.mps.is_available()
          PY
      - name: Run full offline test suite
        run: python -m pytest -q --junitxml=ci-results/pytest.xml
      - name: Upload test results and dependency versions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: study-test-results
          path: ci-results/
          if-no-files-found: ignore
          retention-days: 7
